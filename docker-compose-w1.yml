name: ips-worker-1

services:
  # ==========================================
  # Database Layer (Time-Series)
  # ==========================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ips_influxdb_w1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8086"
    volumes:
      - influxdb1_data:/var/lib/influxdb2
      - influxdb1_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-monitoring}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-monitorings}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    healthcheck:
      test: [ "CMD", "curl", "-sI", "http://localhost:8086/ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Data Plane Layer (Golang Worker Node)
  # ==========================================
  golang-worker-1:
    build:
      context: ./go-monitoring-worker
      dockerfile: Dockerfile
      network: host
    container_name: ips_worker_edge_01
    restart: unless-stopped
    cap_add:
      - NET_RAW
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: "${WORKER_ID:-11111111-1111-1111-1111-111111111111}"
      CONTROL_PLANE_URL: "${EXTERNAL_CONTROL_PLANE_URL:-https://ipmonitor.yaurima.com}"
      HMAC_SECRET: "${HMAC_SECRET}"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_TOKEN: "${INFLUXDB_INIT_ADMIN_TOKEN}"
      INFLUX_ORG: "${INFLUXDB_INIT_ORG:-monitoring}"
      INFLUX_BUCKET: "${INFLUXDB_INIT_BUCKET:-monitorings}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TZ: "America/Phoenix"
    env_file:
      - .env-w1

volumes:
  influxdb1_data:
    driver: local
  influxdb1_config:
    driver: local
