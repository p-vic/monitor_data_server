name: ips-worker

services:
  # ==========================================
  # Database Layer (Time-Series)
  # ==========================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ips_influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE:-upgrade}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-monitoring}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-monitorings}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    healthcheck:
      test: [ "CMD", "curl", "-sI", "http://localhost:8086/ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Data Plane Layer (Golang Worker Node)
  # ==========================================
  golang-worker-2:
    build:
      context: ./go-monitoring-worker
      dockerfile: Dockerfile
      network: host
    container_name: ips_worker_edge_02
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      WORKER_ID: "${WORKER_ID}"
      # External Control Plane URL (Update this on PRODUCTION deploy!)
      CONTROL_PLANE_URL: "${EXTERNAL_CONTROL_PLANE_URL}"
      HMAC_SECRET: "${HMAC_SECRET}"
      INFLUX_URL: "http://localhost:8086"
      INFLUX_TOKEN: "${INFLUXDB_INIT_ADMIN_TOKEN}"
      INFLUX_ORG: "${INFLUXDB_INIT_ORG}"
      INFLUX_BUCKET: "${INFLUXDB_INIT_BUCKET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TZ: "America/Phoenix"
    env_file:
      - .env-w2

volumes:
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1360"
