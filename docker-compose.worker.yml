name: ips-worker

services:
  # ==========================================
  # Database Layer (Time-Series)
  # ==========================================
  influxdb:
    image: influxdb:2.7-alpine
    container_name: ips_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-supersecretpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-monitoring}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-monitorings}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-master-secret-token-12345}
    healthcheck:
      test: [ "CMD", "curl", "-sI", "http://localhost:8086/ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Data Plane Layer (Golang Worker Node)
  # ==========================================
  golang-worker-1:
    build:
      context: ./go-monitoring-worker
      dockerfile: Dockerfile
    container_name: ips_worker_edge_01
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKER_ID: "${WORKER_ID:-11111111-1111-1111-1111-111111111111}"
      # External Control Plane URL (Update this on PRODUCTION deploy!)
      CONTROL_PLANE_URL: "${EXTERNAL_CONTROL_PLANE_URL:-https://ipmonitor.yaurima.com}"
      HMAC_SECRET: "${HMAC_SECRET:-development_secret_key_that_is_long_enough}"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_TOKEN: "${INFLUXDB_INIT_ADMIN_TOKEN:-master-secret-token-12345}"
      INFLUX_ORG: "${INFLUXDB_INIT_ORG:-monitoring}"
      INFLUX_BUCKET: "${INFLUXDB_INIT_BUCKET:-monitorings}"
    env_file:
      - .env
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647

volumes:
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local
